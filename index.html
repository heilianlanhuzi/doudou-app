<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f6eddd">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="豆豆">
<meta name="description" content="豆豆的家：一个温暖的狗狗陪伴与闹钟体验。">
<link rel="icon" href="./icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="./icons/icon.svg">
<link rel="manifest" href="./manifest.webmanifest">
<link rel="stylesheet" href="./style.css">
<title>豆豆的家</title>
</head>
<body>
<header class="top">
  <span class="paw" aria-hidden="true">🐾</span>
  <div><small>DOUDOU'S LITTLE WORLD</small><h1>豆豆的家</h1></div>
  <button class="round" id="reminderButton" aria-label="提醒">♧</button>
  <button class="round" id="settingsButton" aria-label="设置">⚙</button>
</header>
<main>
<section class="room-wrap" aria-label="豆豆的房间">
  <div class="room-label">我的小房间 <span>温馨卧室⌄</span></div>
  <div class="room" id="room">
    <div class="window" aria-hidden="true"><i></i><i></i><b></b></div>
    <div class="plant" aria-hidden="true">🌿</div>
    <div class="bed" aria-hidden="true"><span>床</span><div class="pillow"></div><div class="blanket"></div></div>
    <div class="nightstand" aria-hidden="true"><div class="lamp"></div><div class="drawer"></div></div>
    <div class="rug" aria-hidden="true"></div>
    <button class="dog" id="dog" type="button" aria-label="摸摸豆豆">🐶<span class="bandana" aria-hidden="true">♥</span></button>
    <div class="toy" aria-hidden="true">🦴</div><div class="ball" aria-hidden="true">🔴</div>
  </div>
</section>
<section class="greeting" aria-live="polite"><h2 id="greeting">早上好！</h2><p id="mood">豆豆开心地摇起了尾巴！汪汪！</p></section>
<section class="cards">
  <article class="info"><div class="card-title">⏰ 明天起床</div><strong id="alarmText">07:00</strong><small id="repeatText">闹钟设置已关闭</small><label class="switch" aria-label="启用闹钟设置"><input id="alarmOn" type="checkbox" checked><span></span></label></article>
  <article class="info"><div class="card-title">♡ 豆豆状态</div><strong id="moodShort">心情不错</strong><small>等待你来陪它</small><span class="mini-dog" aria-hidden="true">🐾</span></article>
</section>
<section class="actions"><button class="primary" data-tab="decorate">🪑 布置房间</button><button class="secondary" data-tab="alarm">⏰ 设置闹钟</button></section>
<section class="play"><h3>和豆豆玩一会儿</h3><p>豆豆等你来陪它玩耍～</p><div class="chips"><button data-play="摸摸豆豆">♡ 摸摸豆豆</button><button data-play="陪玩球">⚽ 陪玩球</button><button data-play="喂零食">🦴 喂零食</button><button data-play="陪睡觉">☾ 陪睡觉</button></div></section>
</main>
<nav class="nav" aria-label="主导航">
  <button class="active" data-tab="home" aria-label="我的家">⌂<small>我的家</small></button>
  <button data-tab="decorate" aria-label="布置">🪑<small>布置</small></button>
  <button data-tab="alarm" aria-label="闹钟">◷<small>闹钟</small></button>
  <button data-tab="dog" aria-label="豆豆">🐾<small>豆豆</small></button>
</nav>
<dialog id="panel" aria-labelledby="panelTitle">
  <button class="close" id="closePanel" aria-label="关闭">✕</button>
  <div id="panelBody"></div>
</dialog>
<script src="./app.js"></script>
</body>
</html>
